on:
  workflow_dispatch:
jobs:
  build_apk:
    name: "build apk"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2.14.0
        with:
          flutter-version: "3.38.1"
      - run: flutter clean
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk
    
    
  
  
  
  
