on:
  workflow_dispatch:
jobs:
  job_1:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest,windows-latest,macos-latest]
    runs-on: ${{matrix.os}}
    steps:
    - run: "echo Job ${{github.job}}"
  job_2:
    runs-on: [ubuntu-latest]
    needs: [job_1]
    steps:
    - run: "echo Job ${{github.job}}"
  job_3:
    runs-on: [windows-latest]
    needs: [job_1]
    steps:
    - run: "echo Job ${{github.job}}"
  job_4:
    runs-on: [macos-latest]
    needs: [job_2,job_3]
    steps:
    - run: "echo Job ${{github.job}}"
